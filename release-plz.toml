# Release configuration. The workflow restricts releasing to master; this file
# decides what gets released once there.
#
# https://release-plz.dev/docs/config (read at release-plz 0.4.1, the version
# ci.yml pins).

[workspace]
# The repository has one version, [workspace.package] version in Cargo.toml,
# and one release: a `vX.Y.Z` tag, a changelog and a GitHub release. Nothing
# goes to crates.io: every crate sets `publish = false`. The name
# `rust-pillars` was unregistered there on 2026-10-25, and anyone may take it.
#
# git_only: the previous release is the newest matching git tag, not the
# registry. Without it release-plz downloads the crates.io package of the same
# name as its baseline -- a crate this repository does not own -- and
# `publish = false` packages are not released at all. No matching tag means a
# first release. It also skips `cargo publish`.
git_only = true

# No package is released unless it opts in below. A crate added later stays
# out of the release (and away from its tag) until it is listed.
release = false

# One released package, so a plain tag (and release-plz's default for a
# workspace with one releasable package).
git_tag_name = "v{{ version }}"

git_release_enable = true

# "auto" marks a version carrying a pre-release suffix as a GitHub pre-release,
# so a beta does not present itself as the latest stable download.
git_release_type = "auto"

# Releasing requires merging a Release PR. An ordinary commit landing on master
# does not release, however it got there.
release_always = false

# The released package is a binary; cargo-semver-checks checks library APIs
# only, so there is nothing for it to compare.
semver_check = false

# A release is triggered by changes to the released package's files
# (`cargo package --list -p rust-pillars` lists them).

# Filterable in the GitHub UI as `is:pr label:release`, and excludable from
# "needs human review" queries with `-label:automated`.
pr_labels = ["release", "automated"]

# The bin carries the repository's version: it inherits [workspace.package]
# version, so its bump is the repository's. The domain and core crates inherit
# the same version and are not released on their own; xtask is tooling.
# eval-harness/ is a workspace of its own, which release-plz does not see (an
# entry naming it would fail release-plz's check for overrides it cannot find).
[[package]]
name = "rust-pillars"
release = true

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Release commits are not changes. Parsed in, each one back-fills a changelog
# entry and opens another release PR, which produces another release commit.
#
# The optional-scope group catches both forms release-plz emits: the unscoped
# aggregate `chore: release` and the per-package `chore(<package>): release v<x>`.
commit_parsers = [
  { message = "^chore(\\(.+\\))?: release", skip = true },
]
