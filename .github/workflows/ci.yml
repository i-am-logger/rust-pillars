name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # master is exempt: it is the only ref that releases, so its runs queue
  # rather than cancel one another part-way through a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Read-only by default. Each job asks for what it needs and no more: the jobs
# that run the repository's code (and every dependency's build script) never
# hold a token that can push.
permissions:
  contents: read

# `devenv-checks` runs `devenv test`, the same command a developer runs locally,
# so the workflow is a thin wrapper over the tasks."test:*" set in devenv.nix.
# Add a check by adding a task, never by adding a step here.
jobs:
  devenv-checks:
    name: Lint/UT (${{ matrix.os }})
    # Linux only by default: macOS runners spend private-repo minutes at ten
    # times the Linux rate. A project with a test that only macOS can run
    # adds macos-latest here, so the test runs there instead of skipping
    # itself into a pass on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Cold, this builds the whole dev shell. 30 is not enough for that.
    timeout-minutes: 45
    env:
      # CI never opens a debugger, and debuginfo is most of the codegen time and
      # most of target/ - which is also most of what rust-cache uploads and
      # downloads every run. Set here rather than in Cargo.toml so a local build
      # keeps its debugger.
      CARGO_PROFILE_DEV_DEBUG: "0"
    permissions:
      contents: read
      # cache-nix-action's `purge:` deletes master's superseded nix caches
      # through the Actions API, which needs this. The token goes to that
      # action as an input, not to the run steps: checkout below does not
      # persist it. A fork PR's token is read-only whatever this says.
      actions: write
    # Skip only on release-please's own Release PR: it touches versions and
    # CHANGELOG.md, and the checks passed on the commits it releases. Who
    # opened the PR decides, never its title, which any author can set: the
    # Actions bot, from a release-please--branches-- branch of this
    # repository (release-please's branch name). A PR opened with another
    # token -- a GitHub App's, say -- has another login and is checked like
    # any other.
    #
    # A push to master is never skipped. The release commit is checked like
    # any other, and Release below runs only if it passed.
    if: |
      !(
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'release-please--branches--')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test:mutants-diff mutates the lines changed since the merge base
          # with the default branch; a shallow clone has no merge base.
          fetch-depth: 0
          # `devenv test` runs the repository's code and its dependencies'
          # build scripts; none of them needs to reach the remote.
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://cache.nixos.org https://devenv.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      # The nix store: devenv, the rust toolchain, and every build input.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'devenv.lock') }}
          # No lock hash in the prefix, so a lockfile bump still restores the
          # previous store and builds only the delta.
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Restore everywhere, save only on master. GitHub caches are
          # ref-scoped: a PR reads master's entry but writes its own, so an
          # ungated save spends ~2GB of the 10GB repo budget per open PR and
          # evicts the cargo caches.
          save: ${{ github.ref == 'refs/heads/master' }}
          purge: ${{ github.ref == 'refs/heads/master' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          # A safety valve, not a routine step. Below the working set this runs
          # GC on every save, and GC roots protect most of the store, so it
          # sheds little and rebuilds it next run.
          gc-max-store-size-linux: 8G

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # In its own step so a shell build failure reads as one, and so the
      # toolchain probes below are instant.
      - name: Build the dev shell
        run: devenv shell true

      # ~/.cargo and ./target.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # cmd-format runs rust-cache's `rustc -vV` and `cargo metadata` probes
          # through devenv, so the key tracks the toolchain that actually
          # compiles rather than the runner image's rustup. It needs devenv, so
          # this step has to stay after the install above.
          cmd-format: "devenv shell -- {0}"
          # `key:` is ignored whenever `shared-key:` is set, so the lockfile
          # hash has to live here.
          shared-key: devenv-${{ hashFiles('devenv.lock') }}
          workspaces: ". -> target"
          # Restore everywhere, save only on master, as for the nix store
          # above: a PR's save is scoped to its own ref, so it only spends
          # the 10GB repo budget and evicts master's entries.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run format & lint checks
        run: devenv test

  # The one check for branch protection to require. Lint/UT reports one
  # check per OS, and when its `if:` skips it (the Release PR), it reports
  # under a name with no OS in it, so a required Lint/UT check would never
  # arrive there. A skipped job reports "Success" and does not block a merge
  # even when required (GitHub docs, "Using conditions to control job
  # execution"; by reading), so this job never skips: `always()` runs it
  # even on a cancelled run. It fails unless Lint/UT succeeded on every OS,
  # or was skipped for exactly the Release PR the skip above is for.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [devenv-checks]
    if: always()
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lint/UT passed, or was skipped on the Release PR
        env:
          RESULT: ${{ needs.devenv-checks.result }}
          # The same condition as Lint/UT's `if:`, negated there.
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--branches--') }}
        run: |
          case "$RESULT/$RELEASE_PR" in
          success/*) echo "Lint/UT: success" ;;
          skipped/true) echo "Lint/UT: skipped on release-please's Release PR" ;;
          *)
            echo "Lint/UT: $RESULT (Release PR: $RELEASE_PR)" >&2
            exit 1
            ;;
          esac

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [devenv-checks]
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      # Codecov upload by OIDC: a short-lived token minted for this job, so
      # no Codecov secret is stored. This job only.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships on the runner image. dtolnay/rust-toolchain publishes no
      # versioned release to pin to a commit, so the toolchain comes from
      # rustup directly rather than from a branch-tracking action.
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          # Upload lcov.info only. The search otherwise also picked up
          # xtask/src/coverage.rs, a source file, by its name.
          disable_search: true
          # While the repository was private, Codecov rejected the old
          # tokenless upload (measured). Whether this OIDC upload succeeds
          # while it is private is unmeasured, and either way a failed upload
          # is not a failure of the code. Set this to true once the
          # repository is public and the upload is seen succeeding, so a dead
          # integration shows red rather than green.
          fail_ci_if_error: false

  # release-please (release-please-config.json) opens or updates the Release
  # PR from the Conventional Commits since the last release: it sets one
  # version in Cargo.toml and .claude-plugin/plugin.json and writes
  # CHANGELOG.md. Once that PR is merged, the next run here tags vX.Y.Z and
  # creates the GitHub release. Nothing goes to crates.io: every crate is
  # `publish = false`.
  #
  # Off until the repository variable RELEASE_PR is 'true'. Opening a PR
  # with the workflow token needs the owner's repository setting "Allow
  # GitHub Actions to create and approve pull requests" (Settings > Actions >
  # General); without it the run fails with a 403 and leaves master red. Turn
  # the setting on first, then set the variable. A PR opened with this token
  # starts no workflow run (GitHub's rule for GITHUB_TOKEN), so Lint/UT does
  # not run on the Release PR; the commits it releases passed it on master.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [devenv-checks]
    timeout-minutes: 10
    # `!cancelled()`, not `always()`: a tag and a release are public the
    # moment they exist, so this never runs from a cancelled workflow. Only
    # `success` counts: devenv-checks never skips on a push, so a skipped or
    # failed check means nothing was proven.
    if: |
      vars.RELEASE_PR == 'true' &&
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.devenv-checks.result == 'success'
    permissions:
      contents: write
      # The PR's labels go through the issues API.
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
