name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # master is exempt: it is the only ref that publishes, and release-plz
  # publishes, tags and creates a GitHub release as separate steps. A cancel
  # between them cannot be undone, so master runs queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Read-only by default. Each job asks for what it needs and no more: the jobs
# that run the repository's code (and every dependency's build script) never
# hold a token that can push.
permissions:
  contents: read

# `devenv-checks` runs `devenv test`, the same command a developer runs locally,
# so the workflow is a thin wrapper over the tasks."test:*" set in devenv.nix.
# Add a check by adding a task, never by adding a step here.
#
# release-plz-pr runs after release-plz-release: it computes the next bump from
# the newest tag, which the release job creates.
jobs:
  devenv-checks:
    name: Lint/UT (${{ matrix.os }})
    # Both platforms run the whole suite: a test that only one platform can
    # run must run there, never skip itself into a pass on the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Cold, this builds the whole dev shell. 30 is not enough for that.
    timeout-minutes: 45
    env:
      # CI never opens a debugger, and debuginfo is most of the codegen time and
      # most of target/ - which is also most of what rust-cache uploads and
      # downloads every run. Set here rather than in Cargo.toml so a local build
      # keeps its debugger.
      CARGO_PROFILE_DEV_DEBUG: "0"
    permissions:
      contents: read
      # cache-nix-action's `purge:` deletes master's superseded nix caches
      # through the Actions API, which needs this. The token goes to that
      # action as an input, not to the run steps: checkout below does not
      # persist it. A fork PR's token is read-only whatever this says.
      actions: write
    # Skip only on release-plz's own Release PR: it touches versions and
    # CHANGELOG.md, and the checks passed on the commits it releases. Who
    # opened the PR decides, never its title, which any author can set: the
    # Actions bot, from a release-plz- branch of this repository (release-plz's
    # default `pr_branch_prefix`). A PR opened with another token -- a GitHub
    # App's, say -- has another login and is checked like any other.
    #
    # A push to master is never skipped. The release commit is checked like
    # any other, and Release below runs only if it passed.
    if: |
      !(
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'release-plz-')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test:mutants-diff mutates the lines changed since the merge base
          # with the default branch; a shallow clone has no merge base.
          fetch-depth: 0
          # `devenv test` runs the repository's code and its dependencies'
          # build scripts; none of them needs to reach the remote.
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://cache.nixos.org https://devenv.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      # The nix store: devenv, the rust toolchain, and every build input.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'devenv.lock') }}
          # No lock hash in the prefix, so a lockfile bump still restores the
          # previous store and builds only the delta.
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Restore everywhere, save only on master. GitHub caches are
          # ref-scoped: a PR reads master's entry but writes its own, so an
          # ungated save spends ~2GB of the 10GB repo budget per open PR and
          # evicts the cargo caches.
          save: ${{ github.ref == 'refs/heads/master' }}
          purge: ${{ github.ref == 'refs/heads/master' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          # A safety valve, not a routine step. Below the working set this runs
          # GC on every save, and GC roots protect most of the store, so it
          # sheds little and rebuilds it next run.
          gc-max-store-size-linux: 8G
          gc-max-store-size-macos: 8G

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # In its own step so a shell build failure reads as one, and so the
      # toolchain probes below are instant.
      - name: Build the dev shell
        run: devenv shell true

      # ~/.cargo and ./target.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # cmd-format runs rust-cache's `rustc -vV` and `cargo metadata` probes
          # through devenv, so the key tracks the toolchain that actually
          # compiles rather than the runner image's rustup. It needs devenv, so
          # this step has to stay after the install above.
          cmd-format: "devenv shell -- {0}"
          # `key:` is ignored whenever `shared-key:` is set, so the lockfile
          # hash has to live here.
          shared-key: devenv-${{ hashFiles('devenv.lock') }}
          workspaces: ". -> target"

      - name: Run format & lint checks
        run: devenv test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [devenv-checks]
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships on the runner image. dtolnay/rust-toolchain publishes no
      # versioned release to pin to a commit, so the toolchain comes from
      # rustup directly rather than from a branch-tracking action.
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  # Publishes to crates.io, tags, and creates the GitHub release when a Release
  # PR has been merged. `release_always = false` in release-plz.toml means this
  # is a no-op on an ordinary feature merge — merging the Release PR is the act
  # that authorises a publish.
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    needs: [devenv-checks]
    timeout-minutes: 30
    # `!cancelled()`, not `always()`: this job publishes to an IMMUTABLE
    # registry, so running it from a cancelled workflow is the one thing that
    # cannot be undone. Only `success` counts: devenv-checks never skips on a
    # push, so a skipped or failed check means nothing was proven.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.devenv-checks.result == 'success'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz diffs against the previous tag, so it needs full history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens/updates the Release PR that bumps the version and writes CHANGELOG.md.
  # MUST run after release-plz-release — see the anti-loop note at the top.
  release-plz-pr:
    name: Release-PR
    runs-on: ubuntu-latest
    needs: [devenv-checks, release-plz-release]
    timeout-minutes: 20
    # Requires Release to have SUCCEEDED: a failed publish leaves no new tag,
    # which would re-trigger the same redundant-PR loop. On an ordinary feature
    # merge Release succeeds as a no-op, so this never blocks the first PR.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.devenv-checks.result == 'success' &&
      needs.release-plz-release.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
