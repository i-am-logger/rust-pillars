# layering-fix (pillar 3): someone added `log` to rust-pillars-core, called
# `log::debug!` inside `Machine::handle`, and replaced the dropped-effects
# counter in `Refusals` with a debug line. `cargo xtask layers` fails (core may
# depend on the domain only, and on no external crate). The fix takes `log` out
# of the core and surfaces the drop as state the host polls -- a counter in
# what `Machine::refused()` reports, which the bin reads and warns about --
# not by relaxing layers.toml, not by hiding the edge behind a feature or a
# cfg, and not by deleting the information.
#
# Scratch files go under target/evalchk/ in the working copy, never $TMPDIR.
# The working copy is <root>/target/eval/<case>/<slot>, so the live workspace
# the base was copied from is $EVAL_ROOT; gate files are compared with it.

# --- the task -----------------------------------------------------------------

[[check]]
name = "layers-gate-passes"
run = "cargo xtask layers"
expect = "pass"
on_base = "fail"

# `--all-features` catches an optional dep, `--target all` a cfg-gated one.
# Written to a file first, so a cargo error cannot pass as "no log found".
[[check]]
name = "core-has-no-log-dependency"
run = '''
d=target/evalchk/tree; rm -rf "$d"; mkdir -p "$d" || exit 1
cargo tree -q -p rust-pillars-core -e normal,build --all-features --target all --prefix none > "$d/tree" || exit 1
grep -q '^rust-pillars-core v' "$d/tree" || exit 1
! grep -Eq '^log v' "$d/tree"
'''
expect = "pass"
on_base = "fail"

# The observable the prompt pins: a host that hands a 1024-slot machine 3000
# lines in one event must see the 1976 dropped effects in what `refused()`
# reports -- in `total()`, which the bin's end-of-run warning is gated on, and
# in the `{:?}` the bin prints. The bin itself feeds the core in slices it can
# always hold (and a line's cap is u32::MAX bytes), so no input to the binary
# makes the core refuse anything any more: the check drives `Machine` directly
# with a hidden test, written here and removed on exit whatever the outcome,
# so later checks never see it. It names no field or accessor the fix might
# add, only what the fixture already exposes. A second size the prompt does
# not name (5000 lines: 3976 dropped) rules out a hard-coded number, and a
# queue filled exactly must report nothing.
[[check]]
name = "core-reports-how-many-effects-were-dropped"
run = '''
t=crates/rust-pillars-core/tests/evalchk_refusals.rs
trap 'rm -f "$t"' EXIT
cat > "$t" <<'EOF' || exit 1
//! Hidden eval test: what a full queue drops is visible in `refused()`.

use rust_pillars_core::{Elapsed, Event, Machine, Wire};

const CAP: usize = 1024;

fn fresh() -> Box<Machine<CAP>> {
    Box::new(Machine::new(Elapsed::threshold_ms(1_000)))
}

fn one_read(lines: usize) -> (u64, String, usize) {
    let mut m = fresh();
    let input = b"ab\n".repeat(lines);
    m.handle(Event::Bytes(Wire::of(&input)));
    let r = m.refused();
    (r.total().get(), format!("{r:?}"), m.effects().len())
}

fn names(debug: &str, n: u64) -> bool {
    let n = n.to_string();
    debug.split(|c: char| !c.is_ascii_digit()).any(|w| w == n)
}

#[test]
fn a_full_queue_reports_how_many_effects_it_dropped() {
    for (lines, dropped) in [(3000, 1976), (5000, 3976)] {
        let (total, debug, kept) = one_read(lines);
        assert_eq!(kept, CAP, "the oldest effects are kept");
        assert_eq!(total, dropped, "total() counts the drops: {debug}");
        assert!(names(&debug, dropped), "the Debug shows {dropped}: {debug}");
    }
}

#[test]
fn a_queue_filled_exactly_reports_nothing() {
    let (total, debug, kept) = one_read(CAP);
    assert_eq!(kept, CAP);
    assert_eq!(total, 0, "{debug}");
    assert_eq!(debug, format!("{:?}", fresh().refused()));
}
EOF
cargo test -q -p rust-pillars-core --test evalchk_refusals
'''
expect = "pass"
on_base = "fail"

# --- behaviour kept -----------------------------------------------------------

# Two lines, exactly a full queue (1024 lines), and 3000 lines in one file --
# the size that once overflowed the queue in a single read, which the bin now
# feeds the core in slices it can hold: every line out, and no stderr.
[[check]]
name = "bin-is-quiet-when-nothing-is-dropped"
run = '''
cargo build -q -p rust-pillars || exit 1
b="$PWD/target/debug/rust-pillars"
d=target/evalchk/quiet; rm -rf "$d"; mkdir -p "$d" || exit 1
printf 'one two\nthree\n' > "$d/in"
RUST_LOG=warn timeout 60 "$b" < "$d/in" > "$d/out" 2> "$d/err" || exit 1
test "$(wc -l < "$d/out" | tr -d ' ')" = 2 && test ! -s "$d/err" || exit 1
yes ab | head -n 1024 > "$d/in1024"
RUST_LOG=warn timeout 60 "$b" < "$d/in1024" > "$d/out1024" 2> "$d/err1024" || exit 1
test "$(wc -l < "$d/out1024" | tr -d ' ')" = 1024 && test ! -s "$d/err1024" || exit 1
yes ab | head -n 3000 > "$d/in3000"
RUST_LOG=warn timeout 60 "$b" < "$d/in3000" > "$d/out3000" 2> "$d/err3000" || exit 1
test "$(wc -l < "$d/out3000" | tr -d ' ')" = 3000 && test ! -s "$d/err3000"
'''
expect = "pass"
on_base = "pass"

