[[check]]
name = "the other gate files and the gates' source are unchanged"
run = '''
R=$EVAL_ROOT
test -f "$R/Cargo.toml" || exit 1
for f in ignores.toml .cargo/config.toml crates/rust-code-domain/clippy.toml crates/rust-code-core/clippy.toml; do
  cmp -s "$f" "$R/$f" || exit 1
done
cmp -s crates/rust-code-scan/clippy.toml "$R/evals/no-unsafe-simd/fixture/crates/rust-code-scan/clippy.toml" &&
! grep -rqE '#!?\[(allow|expect)\(' crates/rust-code-scan/src &&
diff -r -x eval.rs xtask "$R/xtask"
'''
expect = "pass"
on_base = "pass"

# The fixture carries whole copies of layers.toml and budgets.toml. If the
# root ones change, the overlay is stale (it would revert the change), so this
# fails the control until the fixture is regenerated: each must be the live
# root file plus only this case's addition.
[[check]]
name = "fixture overlays match the base"
run = '''
r=$EVAL_ROOT
f=$r/evals/no-unsafe-simd/fixture
test "$(diff "$r/layers.toml" "$f/layers.toml" | grep '^[<>]')" = '> rust-code-scan = "core"' &&
test -z "$(diff "$r/budgets.toml" "$f/budgets.toml" | grep '^<')" &&
test -n "$(diff "$r/budgets.toml" "$f/budgets.toml" | grep '^> \[crates.rust-code-scan\]')"
'''
expect = "pass"
on_base = "pass"

# --- still fast -------------------------------------------------------------------

# The prompt rules out a byte-by-byte loop. A hidden test, written here, run in
# release (debug inverts the comparison) and removed whatever happened, times
# first_newline against `iter().position` over 1 MiB with the newline last:
# best of 9 interleaved rounds, and the fast scan must take under 0.6 of the
# loop's time. A safe word-at-a-time scan measured about 0.23, the base's NEON
# path passes, and a plain loop sits near 1.0. Last, so the file it writes
# cannot reach any check above.
[[check]]
name = "first_newline is still faster than a byte loop (release)"
run = '''
f=crates/rust-code-scan/tests/zz_eval_speed.rs
test -d crates/rust-code-scan/tests || exit 1
cat > "$f" <<'RS'
//! Written and removed by the eval check: the scan must beat a byte loop.

use std::hint::black_box;
use std::time::Instant;

use rust_code_scan::first_newline;

fn naive(haystack: &[u8]) -> Option<usize> {
    haystack.iter().position(|&b| b == b'\n')
}

fn once(f: fn(&[u8]) -> Option<usize>, h: &[u8]) -> u128 {
    let t = Instant::now();
    for _ in 0..40 {
        black_box(f(black_box(h)));
    }
    t.elapsed().as_nanos()
}

#[test]
fn eval_first_newline_beats_a_byte_loop() {
    let mut h = vec![b'a'; 1 << 20];
    h[(1 << 20) - 1] = b'\n';
    assert_eq!(first_newline(&h), Some((1 << 20) - 1));
    let (mut fast, mut slow) = (u128::MAX, u128::MAX);
    for _ in 0..9 {
        fast = fast.min(once(first_newline, &h));
        slow = slow.min(once(naive, &h));
    }
    assert!(fast * 10 < slow * 6, "first_newline {fast} ns vs byte loop {slow} ns");
}
RS
timeout 900 cargo test -q --release -p rust-code-scan --test zz_eval_speed </dev/null
s=$?
rm -f "$f"
exit $s
'''
expect = "pass"
on_base = "pass"
