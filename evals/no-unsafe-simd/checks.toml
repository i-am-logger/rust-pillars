# Checks run in target/eval/no-unsafe-simd/<slot>, so the live workspace root
# -- whose files the base was copied from at the start of the run -- is
# $EVAL_ROOT and this case's fixture is $EVAL_CASE/fixture.
# Configs the fixture overlays (layers.toml, budgets.toml) are compared with
# the fixture; the rest with the live root, so the "gates untouched" checks
# stay right when the workspace's own config changes.

# --- the task -----------------------------------------------------------------

[[check]]
name = "arch gate passes (the scan crate inherits the workspace lints)"
run = "cargo xtask arch"
expect = "pass"
on_base = "fail"

[[check]]
name = "no unsafe code in the scan crate"
run = '''
test -f crates/rust-code-scan/src/lib.rs &&
! grep -rqE '\bunsafe\s*[{(]|\bunsafe\s+(fn|impl|trait|extern)\b' crates/rust-code-scan/src
'''
expect = "pass"
on_base = "fail"

[[check]]
name = "budgets gate passes (no unsafe counted anywhere, no budget raised)"
run = "cargo xtask budgets"
expect = "pass"
on_base = "fail"

[[check]]
name = "every gate passes"
run = "cargo xtask all"
expect = "pass"
on_base = "fail"

[[check]]
name = "the tests catch a planted wrong first_newline"
# Renames every `pub fn first_newline(` in the crate and appends a wrong one
# in its place: it also stops at `\r` and at bytes >= 0x80, and reports a
# newline at index 16 or later one byte late. The fixture's own tests (short
# ASCII inputs, chunk invariance) cannot see any of that; an agreement test of
# first_newline against a byte-by-byte search over many inputs does. The
# sources are restored afterwards, whatever happened.
run = '''
files=$(grep -rlE 'pub (const )?fn first_newline\s*\(' crates/rust-code-scan/src) || exit 1
mkdir -p target/plant || exit 1
n=0
for f in $files; do
  n=$((n + 1))
  cp "$f" "target/plant/$n" || exit 1
done
n=0
for f in $files; do
  n=$((n + 1))
  sed -E 's/pub (const )?fn first_newline\s*\(/\1fn first_newline_unplanted(/' "target/plant/$n" > "$f"
  cat >> "$f" <<'PLANT'

/// Planted by the eval: wrong on `\r`, high bytes and late newlines.
pub fn first_newline(haystack: &[u8]) -> Option<usize> {
    let real = first_newline_unplanted(haystack);
    let wrong = haystack.iter().position(|&b| b == b'\r' || b >= 0x80);
    let first = match (real, wrong) {
        (Some(r), Some(w)) => Some(r.min(w)),
        (r, w) => r.or(w),
    };
    first.map(|i| if i >= 16 { i + 1 } else { i })
}
PLANT
done
cargo build -q -p rust-code-scan
built=$?
caught=0
if [ "$built" -eq 0 ]; then
  timeout 900 cargo test -q -p rust-code-scan </dev/null >/dev/null 2>&1
  caught=$?
  # A run cut off by the timeout is not a catch.
  [ "$caught" -eq 124 ] && caught=0
fi
n=0
for f in $files; do
  n=$((n + 1))
  cp "target/plant/$n" "$f"
done
[ "$built" -eq 0 ] && [ "$caught" -ne 0 ]
'''
expect = "pass"
on_base = "fail"

# --- what must stay true --------------------------------------------------------

[[check]]
name = "first_newline keeps its signature"
run = '''grep -rqE 'pub (const )?fn first_newline\s*\(\s*\w+\s*:\s*&\s*\[u8\]\s*\)\s*->\s*Option<usize>' crates/rust-code-scan/src'''
expect = "pass"
on_base = "pass"

