[package]
name = "rust-code-checksum"
description = "Adler-32 checksums over byte streams (role: domain)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io: the repository releases as a git tag (release-plz.toml).
publish = false

[features]
# Pillar 5: no_std, and no allocator either -- the hasher keeps two `u32`s and
# borrows the bytes it is fed. `test:bare` builds it with no features.
default = []

[dependencies]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
