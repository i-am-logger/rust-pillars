# embed-at-build-time: the bin reads crates/rust-pillars/assets/stopwords.txt
# from a cwd-relative path at every launch. A good solution embeds the asset
# itself at build time, so the binary runs from any directory and with the
# file gone, and an edit to the asset reaches the next build.
#
# The binary is $PWD/target/debug/rust-pillars: the devenv shell sets
# CARGO_TARGET_DIR=./target, relative to the working copy. Every behaviour
# check runs it from a scratch directory under target/evalchk/ (where the
# cwd-relative asset path does not resolve), never from $TMPDIR, with stdin
# closed or given, under a timeout.
#
# The working copy is <root>/target/eval/<case>/<slot>: the live workspace is
# $EVAL_ROOT and this case's fixture $EVAL_CASE/fixture.
# Gate files are compared there, outside the run's working copy.

# --- the task -----------------------------------------------------------

[[check]]
name = "stopwords subcommand works from another directory and reports the asset's count"
run = '''
cargo build -q -p rust-pillars || exit 1
b="$PWD/target/debug/rust-pillars"
d="$PWD/target/evalchk/cwd1"; rm -rf "$d"; mkdir -p "$d" || exit 1
want=$(grep -Ecv '^[[:space:]]*(#|$)' crates/rust-pillars/assets/stopwords.txt)
got=$(cd "$d" && timeout 60 "$b" stopwords </dev/null) || exit 1
test "$(printf %s "$got" | tr -dc 0-9)" = "$want"
'''
expect = "pass"
on_base = "fail"

[[check]]
name = "counting stdin works from another directory"
run = '''
cargo build -q -p rust-pillars || exit 1
b="$PWD/target/debug/rust-pillars"
d="$PWD/target/evalchk/cwd2"; rm -rf "$d"; mkdir -p "$d" || exit 1
out=$(cd "$d" && printf 'the cat sat\non a mat\n' | timeout 60 "$b") || exit 1
test -n "$out"
'''
expect = "pass"
on_base = "fail"

[[check]]
name = "built binary does not need the asset on disk at run time"
run = '''
cargo build -q -p rust-pillars || exit 1
b="$PWD/target/debug/rust-pillars"
d="$PWD/target/evalchk/cwd3"; rm -rf "$d"; mkdir -p "$d" || exit 1
a=crates/rust-pillars/assets/stopwords.txt
mv "$a" "$a.away" || exit 1
(cd "$d" && timeout 60 "$b" stopwords </dev/null >/dev/null); r=$?
mv "$a.away" "$a"
exit $r
'''
expect = "pass"
on_base = "fail"

# Catches an embedded copy kept beside a disk read ("override if present") or
# a CARGO_MANIFEST_DIR absolute path. Known false fail: a #[cfg(test)] drift
# test in src/ that reads the asset back from disk.
[[check]]
name = "no run-time read of the asset in the bin's source"
run = "! grep -rqE 'read_to_string|File::open|fs::read' crates/rust-pillars/src"
expect = "pass"
on_base = "fail"

[[check]]
name = "exactly one build-time embed (include!/include_str!/include_bytes!) in the bin crate"
run = '''
n=$(grep -rhE --include='*.rs' '^[[:space:]]*([^/[:space:]].*)?\binclude(_str|_bytes)?!' crates/rust-pillars | wc -l)
test "$n" -eq 1
'''
expect = "pass"
on_base = "fail"

# Last of the task checks: it edits the asset and restores it.
[[check]]
name = "an edit to the asset reaches the next build (no drifting copy)"
run = '''
cargo build -q -p rust-pillars || exit 1
b="$PWD/target/debug/rust-pillars"
a=crates/rust-pillars/assets/stopwords.txt
d="$PWD/target/evalchk/cwd4"; rm -rf "$d"; mkdir -p "$d" || exit 1
cp "$a" "$d/keep" || exit 1
n1=$(cd "$d" && timeout 60 "$b" stopwords </dev/null | tr -dc 0-9) && test -n "$n1" &&
  printf 'zyzzyva\n' >> "$a" && cargo build -q -p rust-pillars &&
  n2=$(cd "$d" && timeout 60 "$b" stopwords </dev/null | tr -dc 0-9); r=$?
cp "$d/keep" "$a"
cargo build -q -p rust-pillars
test "$r" -eq 0 && test -n "$n2" && test "$n2" -eq $((n1 + 1))
'''
expect = "pass"
on_base = "fail"

# --- integrity ----------------------------------------------------------

[[check]]
name = "the asset is still there, unchanged"
run = "cmp crates/rust-pillars/assets/stopwords.txt $EVAL_CASE/fixture/crates/rust-pillars/assets/stopwords.txt"
expect = "pass"
on_base = "pass"

[[check]]
name = "workspace builds, all targets"
run = "cargo build -q --workspace --all-targets"
expect = "pass"
on_base = "pass"

[[check]]
name = "clippy -D warnings"
run = "cargo clippy --quiet --workspace --all-targets --all-features -- -D warnings"
expect = "pass"
on_base = "pass"

[[check]]
name = "rustfmt clean"
run = "cargo fmt --all --check"
expect = "pass"
on_base = "pass"

[[check]]
name = "tests pass"
run = "cargo nextest run --workspace --all-features --no-fail-fast --cargo-quiet"
expect = "pass"
on_base = "pass"

[[check]]
name = "cargo xtask all"
run = "cargo xtask all"
expect = "pass"
on_base = "pass"

[[check]]
name = "domain and core still build for bare metal"
run = "cargo build -q -p rust-pillars-domain -p rust-pillars-core --target x86_64-unknown-none"
expect = "pass"
on_base = "pass"

# --- the gates were not weakened ----------------------------------------

[[check]]
name = "gate configs unchanged (layers, budgets, clippy, deny, ignores, cargo config)"
run = '''
R=$EVAL_ROOT
test -f "$R/Cargo.toml" || exit 1
for f in layers.toml budgets.toml clippy.toml deny.toml ignores.toml .cargo/config.toml \
         crates/rust-pillars-domain/clippy.toml crates/rust-pillars-core/clippy.toml; do
  cmp -s "$f" "$R/$f" || exit 1
done
test ! -e crates/rust-pillars/clippy.toml && test -z "$(find . -name .clippy.toml -not -path './target/*')"
'''
expect = "pass"
on_base = "pass"

[[check]]
name = "Cargo.toml [workspace.lints] unchanged"
run = '''
lints() { sed -n '/^\[workspace\.lints/,/^\[profile/p' "$1"; }
b=$(lints $EVAL_ROOT/Cargo.toml) && test -n "$b" && test "$(lints Cargo.toml)" = "$b"
'''
expect = "pass"
on_base = "pass"

[[check]]
name = "the bin crate still inherits the workspace lints, with no suppression"
run = '''
grep -A1 '^\[lints\]' crates/rust-pillars/Cargo.toml | grep -qx 'workspace = true' &&
! grep -rqE '#!?\[(allow|expect)\(' crates/rust-pillars/src
'''
expect = "pass"
on_base = "pass"

[[check]]
name = "the gates' source is untouched"
run = "diff -r -x eval.rs xtask $EVAL_ROOT/xtask"
expect = "pass"
on_base = "pass"

# The fixture replaces whole root files. If the root ones change, the overlay
# is stale (it would silently revert the change), so this fails the control
# until the fixture is regenerated from the new root files and these updated.
[[check]]
name = "fixture-overlays-match-base"
run = 'test "$(cksum < $EVAL_ROOT/crates/rust-pillars/src/main.rs)" = "848397690 4938"'
expect = "pass"
on_base = "pass"
