# cargo-deny: what may enter the dependency graph (pillar 3's supply-chain
# half). test:deny checks licenses, bans and sources, which need no network;
# `cargo deny check advisories` fetches the RustSec database and runs as
# qa:advisories.

[graph]
all-features = true

[licenses]
# Every license a dependency may carry. A new one is a reviewed change here.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
]
confidence-threshold = 0.9

# The workspace's own licence, CC-BY-NC-SA-4.0, is allowed for its own crates
# only, never graph-wide: a dependency under a NonCommercial licence is a
# reviewed change, not a pass. xtask and eval-harness are `publish = false`,
# which [licenses.private] below covers; the crates under crates/ set no
# `publish`, so each is named here.
[[licenses.exceptions]]
crate = "rust-code"
allow = ["CC-BY-NC-SA-4.0"]

[[licenses.exceptions]]
crate = "rust-code-core"
allow = ["CC-BY-NC-SA-4.0"]

[[licenses.exceptions]]
crate = "rust-code-domain"
allow = ["CC-BY-NC-SA-4.0"]

[licenses.private]
ignore = true

[bans]
# Two versions of one crate double its compile time and binary size; warn so
# it is seen, and deny wildcard requirements outright.
multiple-versions = "warn"
wildcards = "deny"
# A `path` dependency on a workspace member has no version to pin.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
